apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipient-service
  namespace: port-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipient-service
  template:
    metadata:
      labels:
        app: recipient-service
    spec:
      containers:
        - name: recipient-service
          image: port-poc-recipient-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: port-poc-config
            - secretRef:
                name: port-poc-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
