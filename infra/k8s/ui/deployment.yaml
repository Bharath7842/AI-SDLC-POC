apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: port-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: port-poc-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            # The browser (not the pod) calls this URL directly, so it must
            # be reachable from wherever the browser runs — here that's the
            # same host-forwarded address used for local Docker Compose.
            # A real cluster deployment needs an Ingress (or an nginx
            # reverse-proxy inside this image) exposing recipient-service
            # externally; out of scope for this scaffold-stage verification
            # since no UI code calls the API yet (that's DEV-S12).
            - name: API_URL
              value: "http://localhost:8080"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
