# Cloud profile — Kubernetes DNS hostnames (see /infra/k8s/configmap.yaml
# and secret.yaml, which supply these as pod environment variables).
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql.default.svc.cluster.local}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:port_requests}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:TODO}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    baselineOnMigrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.default.svc.cluster.local}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:TODO}

minio:
  host: ${MINIO_HOST:minio.default.svc.cluster.local}
  port: ${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY:TODO}
  secret-key: ${MINIO_SECRET_KEY:TODO}
  bucket: port-requests
