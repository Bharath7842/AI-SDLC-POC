# Local profile. Defaults assume running the jar directly on the host
# (e.g. `mvn spring-boot:run`) against the Docker Compose stack's
# host-mapped ports. When this service itself runs *inside* the Compose
# stack (see /infra/docker-compose.yml), its `environment:` block
# overrides these to the in-network service DNS names/ports instead.
api-key: test-key-local

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:port_requests}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:rootpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    baselineOnMigrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

minio:
  host: ${MINIO_HOST:localhost}
  port: ${MINIO_PORT:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: port-requests
